version: 2

models:
  - name: dim_payment_methods
    columns:
      - name: payment_method_key
        tests:
          - not_null
          - unique
      - name: payment_method
        tests:
          - not_null

  - name: fct_orders
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              values: ['confirmed', 'draft', 'cancelled', 'failed']
      - name: amount_total
        tests:
          - not_null
      - name: currency
        tests:
          - not_null
      - name: order_date
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_day
      - name: order_time
        tests:
          - not_null
          - relationships:
              to: ref('dim_time')
              field: time_of_day

  - name: fct_payments
    columns:
      - name: payment_id
        tests:
          - not_null
          - unique
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('fct_orders')
              field: order_id
      - name: payment_method_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_payment_methods')
              field: payment_method_key
      - name: payment_status
        tests:
          - not_null
          - accepted_values:
              values: ['succeeded', 'failed', 'cancelled', 'void', 'refunded']
      - name: amount
        tests:
          - not_null
      - name: currency
        tests:
          - not_null
      - name: payment_date
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_day
      - name: payment_time
        tests:
          - not_null
          - relationships:
              to: ref('dim_time')
              field: time_of_day

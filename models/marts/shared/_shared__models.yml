version: 2

models:
  - name: dim_customers
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique
      - name: email_hash
        tests:
          - not_null
  
  - name: dim_date
    columns:
      - name: date_day
        tests:
          - not_null
          - unique
      - name: year
        tests:
          - not_null
      - name: quarter
        tests:
          - not_null
      - name: month
        tests:
          - not_null
      - name: day
        tests:
          - not_null
      - name: day_of_week_iso
        tests:
          - not_null
      - name: week_of_year_iso
        tests:
          - not_null
      - name: is_weekend
        tests:
          - not_null
      - name: is_month_start
        tests:
          - not_null
      - name: is_month_end
        tests:
          - not_null
      - name: month_name
        tests:
          - not_null
      - name: day_name
        tests:
          - not_null
      - name: year_month
        tests:
          - not_null
      - name: year_quarter
        tests:
          - not_null

  - name: dim_time
    columns:
      - name: time_of_day
        tests:
          - not_null
          - unique
      - name: hour_24
        tests:
          - not_null
      - name: minute
        tests:
          - not_null
      - name: second
        tests:
          - not_null
      - name: time_hhmm
        tests:
          - not_null
      - name: day_part
        tests:
          - not_null
      - name: is_business_hours
        tests:
          - not_null
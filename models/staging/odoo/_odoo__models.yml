version: 2

models:
  - name: stg_odoo__customers
    columns:
      - name: customer_id
        tests: [not_null, unique]
      - name: email_hash
        tests: [not_null]

  - name: stg_odoo__orders
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_odoo__customers')
              field: customer_id
      - name: order_status
        tests:
          - accepted_values:
              values: ["confirmed", "draft", "cancelled", "failed"]
      - name: amount_total
        tests: [not_null]
      - name: currency
        tests: [not_null]

  - name: stg_odoo__payment_methods
    columns:
      - name: payment_method_key
        tests: [not_null, unique]
      - name: payment_method
        tests: [not_null]

  - name: stg_odoo__payments
    columns:
      - name: payment_id
        tests: [not_null, unique]
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_odoo__orders')
              field: order_id
      - name: payment_method_key
        tests:
          - not_null
          - relationships:
              to: ref('stg_odoo__payment_methods')
              field: payment_method_key
      - name: payment_status
        tests:
          - accepted_values:
              values: ["succeeded", "failed", "cancelled", "void"]
      - name: amount
        tests: [not_null]
      - name: currency
        tests: [not_null]


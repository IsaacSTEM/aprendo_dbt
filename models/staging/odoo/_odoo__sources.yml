version: 2

sources:
  - name: odoo
    database: SNOWFLAKE_LEARNING_DB
    schema: BRONZE
    tables:
      - name: raw_orders
        config:
          freshness:
            warn_after: {count: 10, period: day}
            error_after: {count: 15, period: day}
          loaded_at_field: "CAST(ingested_at AS TIMESTAMP)"
      - name: raw_payments
      - name: raw_web_events
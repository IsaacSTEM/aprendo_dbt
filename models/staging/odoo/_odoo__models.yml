version: 2

models:
  - name: stg_odoo__customers
    description: Tabla de clientes creada por Odoo
    columns:
      - name: customer_id
        description: Id generado y asignado a cada cliente por Odoo
        tests: [not_null, unique]
      - name: email_hash
        tests: [not_null]

  - name: stg_odoo__orders
    columns:
      - name: order_id
        description: '{{ doc("descripcion_generica") }}'
        tests: [not_null, unique]
      - name: customer_id
        description: '{{ doc("descripcion_generica") }}'
        tests:
          - not_null
          - relationships:
              to: ref('stg_odoo__customers')
              field: customer_id
      - name: order_status
        description: '{{ doc("descripcion_generica") }}'
        tests:
          - accepted_values:
              values: ["confirmed", "draft", "cancelled", "failed"]
      - name: amount_total
        description: '{{ doc("descripcion_generica") }}'
        tests: [not_null]
      - name: currency
        description: '{{ doc("descripcion_generica") }}'
        tests: [not_null]

  - name: stg_odoo__payment_methods
    columns:
      - name: payment_method_key
        tests: [not_null, unique]
      - name: payment_method
        tests: [not_null]

  - name: stg_odoo__payments
    columns:
      - name: payment_id
        tests: [not_null, unique]
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_odoo__orders')
              field: order_id
      - name: payment_method_key
        tests:
          - not_null
          - relationships:
              to: ref('stg_odoo__payment_methods')
              field: payment_method_key
      - name: payment_status
        tests:
          - accepted_values:
              values: ["succeeded", "failed", "cancelled", "void"]
      - name: amount
        tests: [not_null]
      - name: currency
        tests: [not_null]

  - name: stg_odoo__web_sessions
    columns:
      - name: session_id
        tests: [not_null, unique]
      - name: user_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_odoo__customers')
              field: customer_id
      - name: session_start_ts
        tests: [not_null]
      - name: session_end_ts
        tests: [not_null]

  - name: stg_odoo__web_events
    columns:
      - name: event_id
        tests: [not_null, unique]
      - name: session_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_odoo__web_sessions')
              field: session_id
      - name: event_ts
        tests: [not_null]
      - name: event_name
        tests:
          - not_null
          - accepted_values:
              values:
                - page_view
                - add_to_cart
                - checkout_start
                - form_error
                - search
                - purchase
                - login
                - logout
      - name: page
        tests: [not_null]


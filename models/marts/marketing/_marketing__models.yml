version: 2

models:
  - name: dim_web_sessions
    columns:
      - name: session_id
        tests:
          - not_null
          - unique
      - name: user_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id

      - name: session_start_ts
        tests:
          - not_null
      - name: session_end_ts
        tests:
          - not_null

      - name: session_start_date
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_day
      - name: session_start_time
        tests:
          - not_null
          - relationships:
              to: ref('dim_time')
              field: time_of_day
      - name: session_end_date
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_day
      - name: session_end_time
        tests:
          - not_null
          - relationships:
              to: ref('dim_time')
              field: time_of_day

  - name: fct_web_events
    columns:
      - name: event_id
        tests:
          - not_null
          - unique
      - name: session_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_web_sessions')
              field: session_id
      - name: event_ts
        tests:
          - not_null
      - name: event_name
        tests:
          - not_null
          - accepted_values:
              values:
                - page_view
                - add_to_cart
                - checkout_start
                - form_error
                - search
                - purchase
                - login
                - logout
      - name: page
        tests:
          - not_null

      - name: event_date
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_day
      - name: event_time
        tests:
          - not_null
          - relationships:
              to: ref('dim_time')
              field: time_of_day